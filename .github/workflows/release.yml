name: Compile Release

# Korean fork release: pushing an X.Y.Z-ko.N tag builds every supported board (same matrix
# as upstream's release.yml) and creates the GitHub release with all assets. Upstream
# triggers on `release: published`; this fork creates the release from the tag push so
# docs/release-notes/<tag>.md becomes the release body.
#
# Assets per board (device = x3-x4 | sticky | x4pro | x4c | papermono):
#   crosspoint-<tag>-<device>.bin      - OTA / SD-update image, looked up by 1.6.x-ko firmware
#                                        (upstream's per-board naming, #3493)
#   CrossPoint-<tag>-<device>-full.bin - merged full-flash image (bootloader+partitions+app).
#                                        The -full suffix is required: GitHub asset names are
#                                        case-insensitive, so CrossPoint-<tag>-<device>.bin would
#                                        collide with the OTA asset above.
# X3/X4 only, kept for older tooling:
#   firmware.bin                       - OTA asset for 1.5.x-ko devices (legacy name, keep)
#   CrossPoint-<tag>.bin               - merged image under the pre-1.6.5 name (web flasher)
#   bootloader.bin, partitions.bin

on:
  push:
    tags:
    - '*'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_env: gh_release
            device: x3-x4
            chip: esp32c3
          - release_env: sticky-gh_release
            device: sticky
            chip: esp32s3
          - release_env: x4pro-gh_release
            device: x4pro
            chip: esp32s3
          - release_env: x4c-gh_release
            device: x4c
            chip: esp32s3
          - release_env: papermono-gh_release
            device: papermono
            chip: esp32s3
    env:
      PIO_ENV: ${{ matrix.release_env }}
      BUILD_DIR: .pio/build/${{ matrix.release_env }}
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Validate release version
      run: |
        version="${GITHUB_REF_NAME#v}"
        configured_version="$(sed -n 's/^version = //p' platformio.ini | head -n1)"
        if [ "$version" != "$configured_version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match platformio.ini version $configured_version"
          exit 1
        fi

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio-${{ matrix.release_env }}

    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        enable-cache: false

    - name: Install PlatformIO Core
      run: |
        uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip esptool
        # platform-espressif32's builder/main.py imports these unconditionally; its own
        # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
        # but isn't picking them up reliably in this runner image, so pin them explicitly.
        uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
          "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
          "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
          "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

    - name: Pin pioarduino core inside the platform penv
      run: |
        set -euo pipefail
        # Envs with custom_sdkconfig run a nested `pio run` from
        # ~/.platformio/penv. Keep that core on the same version as the outer core.
        # See https://github.com/pioarduino/platform-espressif32/issues/529
        pio pkg install -e "$PIO_ENV"
        uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
        ~/.platformio/penv/bin/pio --version

    - name: Build CrossPoint
      run: pio run -e "$PIO_ENV" -j1

    - name: Check firmware fits the stock OTA partition
      run: |
        # 0x640000 = stock Crosspoint OTA app slot (see docs/firmware-size-budget.md). Every
        # board uses the same partitions.csv.
        size=$(stat -c %s "$BUILD_DIR/firmware.bin")
        limit=$((0x640000))
        echo "${{ matrix.device }} firmware.bin: $size bytes (limit $limit)"
        if [ "$size" -gt "$limit" ]; then
          echo "::error::${{ matrix.device }} firmware.bin ($size) exceeds the stock OTA partition ($limit)"
          exit 1
        fi

    - name: Prepare assets
      run: |
        set -euo pipefail
        version="${GITHUB_REF_NAME#v}"
        mkdir -p dist
        cp "$BUILD_DIR/firmware.bin" "dist/crosspoint-${version}-${{ matrix.device }}.bin"
        esptool.py --chip ${{ matrix.chip }} merge_bin \
          -o "dist/CrossPoint-${GITHUB_REF_NAME}-${{ matrix.device }}-full.bin" \
          --flash_mode dio \
          --flash_freq 80m \
          --flash_size 16MB \
          0x0 "$BUILD_DIR/bootloader.bin" \
          0x8000 "$BUILD_DIR/partitions.bin" \
          0x10000 "$BUILD_DIR/firmware.bin"
        if [ "${{ matrix.device }}" = "x3-x4" ]; then
          cp "$BUILD_DIR/firmware.bin" dist/firmware.bin
          cp "dist/CrossPoint-${GITHUB_REF_NAME}-x3-x4-full.bin" "dist/CrossPoint-${GITHUB_REF_NAME}.bin"
          cp "$BUILD_DIR/bootloader.bin" "$BUILD_DIR/partitions.bin" dist/
        fi
        ls -l dist

    - name: Stage release assets
      uses: actions/upload-artifact@v6
      with:
        name: release-${{ matrix.device }}
        path: dist/*
        if-no-files-found: error
        retention-days: 1
        compression-level: 0

    - name: Upload debug symbols
      uses: actions/upload-artifact@v6
      with:
        name: debug-${{ matrix.device }}
        path: |
          ${{ env.BUILD_DIR }}/firmware.elf
          ${{ env.BUILD_DIR }}/firmware.map

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - name: Download release assets
      uses: actions/download-artifact@v6
      with:
        path: dist
        pattern: release-*
        merge-multiple: true

    - name: Verify assets
      run: |
        set -euo pipefail
        version="${GITHUB_REF_NAME#v}"
        for device in x3-x4 sticky x4pro x4c papermono; do
          test -f "dist/crosspoint-${version}-${device}.bin"
          test -f "dist/CrossPoint-${GITHUB_REF_NAME}-${device}-full.bin"
        done
        for f in firmware.bin "CrossPoint-${GITHUB_REF_NAME}.bin" bootloader.bin partitions.bin; do
          test -f "dist/$f"
        done
        # GitHub compares asset names case-insensitively; two names that differ only in
        # case overwrite each other mid-upload.
        dupes=$(find dist -maxdepth 1 -type f -printf '%f\n' | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
        if [ -n "$dupes" ]; then
          echo "::error::Asset names collide case-insensitively: $dupes"
          exit 1
        fi
        ls -l dist

    - name: Resolve release notes
      id: notes
      run: |
        NOTES="docs/release-notes/${{ github.ref_name }}.md"
        if [[ -f "$NOTES" ]]; then
          echo "Using release notes from $NOTES"
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          echo "generate=false" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::No release notes at $NOTES; falling back to auto-generated notes."
          echo "path=" >> "$GITHUB_OUTPUT"
          echo "generate=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Create Release with Assets
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        body_path: ${{ steps.notes.outputs.path }}
        generate_release_notes: ${{ steps.notes.outputs.generate }}
        draft: false
        prerelease: false

    - name: Trigger docs deployment
      continue-on-error: true
      run: gh workflow run deploy.yml -R crosspoint-reader-ko/crosspoint-reader-docs
      env:
        GH_TOKEN: ${{ secrets.CROSSPOINT_ACTION_TOKEN }}

    - name: Trigger crosspoint-cloud firmware sync
      continue-on-error: true
      run: gh workflow run sync-version.yml -R crosspoint-reader-ko/crosspoint-cloud
      env:
        GH_TOKEN: ${{ secrets.CROSSPOINT_ACTION_TOKEN }}
